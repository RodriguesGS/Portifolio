<nav class="mt-8 flex justify-center w-full px-6">
    <ul class="flex w-xl items-center justify-around backdrop-blur-md bg-white/5 border border-white/10 rounded-2xl px-4 py-2 shadow-lg">
        @for (item of navItems; track item.route) {
            <li class="group relative py-1">
                <a [routerLink]="item.route"
                   routerLinkActive="active"
                   [routerLinkActiveOptions]="item.exact ? { exact: true } : {}"
                   class="nav-link flex items-center justify-center p-3 rounded-xl transition-all duration-300 hover:bg-white/10 hover:scale-110">
                    <mat-icon class="nav-icon" [svgIcon]="item.icon"></mat-icon>
                </a>

                <span class="absolute -bottom-6 left-1/2 -translate-x-1/2 text-xs text-text-secondary opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap pointer-events-none">
                    {{ item.label }}
                </span>
            </li>
        }
    </ul>
</nav>
