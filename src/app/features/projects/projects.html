<div class="flex flex-col items-center justify-center h-full w-full max-w-3xl gap-8 py-8">
    <div class="flex flex-col gap-1">
        <h2 class="text-4xl font-semibold text-text-primary">
            Projetos
        </h2>
        <div class="h-0.5 w-12 mx-auto mt-2 bg-primary rounded-full"></div>
    </div>

    <div class="grid grid-cols-2 gap-8 w-full">
        @for (project of projects; track project.name) {
            <a [href]="project.github" target="_blank" class="project-card group">
                <div class="flex justify-between items-start mb-3">
                    <span class="text-base font-semibold text-text-primary group-hover:text-primary transition-colors duration-300">
                        {{ project.name }}
                    </span>
                </div>

                <div class="flex items-center gap-2">
                    <span class="status-badge" [attr.data-status]="project.status">
                        {{ project.status }}
                    </span>
                    <span class="text-xs text-text-secondary">
                        {{ project.year }}
                    </span>
                </div>

                <p class="text-sm text-text-secondary mb-4">
                    {{ project.description }}
                </p>

                <div class="flex justify-between items-center">
                    <div class="flex gap-2 flex-wrap">
                        @for (tag of project.tags; track tag) {
                            <span class="tag">{{ tag }}</span>
                        }
                    </div>
                    <mat-icon svgIcon="github" class="github-icon"></mat-icon>
                </div>
            </a>
        }
    </div>
</div>
