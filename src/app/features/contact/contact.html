<div class="flex flex-col items-center justify-center h-full w-full max-w-2xl gap-4 py-8">
    <div class="flex flex-col gap-1 text-center">
        <h2 class="text-3xl font-semibold text-text-primary">
            Contato
        </h2>
        <div class="h-0.5 w-10 mx-auto mt-1 bg-primary rounded-full"></div>
    </div>

    <div class="flex flex-col gap-3 text-center">
        <p class="text-sm text-text-secondary leading-relaxed max-w-md">
            Tem um projeto, uma oportunidade ou só quer trocar uma ideia sobre dados?
            <strong class="text-primary font-medium">Me manda uma mensagem.</strong>
        </p>
        <a href="mailto:contato@rodriguesgs.com" class="font-mono text-sm text-text-secondary border-b border-dashed border-white/20 pb-0.5 w-fit mx-auto transition-all duration-300 hover:text-primary hover:border-primary">
            contato@rodriguesgs.com
        </a>
    </div>

    <div class="grid grid-cols-3 gap-4 w-full mt-14">
        @for (item of items; track item.label) {
            <a [href]="item.href" target="_blank" class="contact-card flex flex-col p-5 bg-white/3 rounded-2xl border border-white/20 duration-300 group" [style.--accent]="item.color">
                <div class="flex justify-between items-start mb-4">
                    <div class="p-2.5 rounded-xl bg-white/5 border border-white/10 transition-all duration-300 group-hover:border-(--accent) group-hover:bg-[color-mix(in_srgb,var(--accent)_10%,transparent)]">
                        <mat-icon [svgIcon]="item.svgIcon"[class]="item.svgIcon" class="contact-icon duration-300" ></mat-icon>
                    </div>
                    <mat-icon class="text-white/20 transition-all duration-300 group-hover:text-(--accent) group-hover:translate-x-1 group-hover:-translate-y-1">
                        arrow_outward
                    </mat-icon>
                </div>

                <div class="flex flex-col gap-1 text-left">
                    <span class="text-base font-semibold text-text-primary transition-colors duration-300 group-hover:text-(--accent)">
                        {{ item.label }}
                    </span>
                    <span class="text-xs text-text-secondary leading-relaxed">
                        {{ item.desc }}
                    </span>
                </div>

                <div class="mt-4 h-0.5 w-8 rounded-full bg-white/10 transition-all duration-500 group-hover:w-full group-hover:bg-(--accent) group-hover:opacity-60"></div>
            </a>
        }
    </div>
</div>
