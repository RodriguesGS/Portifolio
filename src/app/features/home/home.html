<section class="flex flex-col items-center justify-center h-full gap-6 py-8">
    <div class="img-wrapper mt-10 w-28 h-28 rounded-full transition-all duration-300">
        <img src="/assets/img/perfil.jpg" alt="Imagem de Perfil" class="w-full h-full rounded-full object-cover">
    </div>

    <div class="flex flex-col gap-1">
        <h1 class="font-semibold text-5xl tracking-wide text-text-primary">
            Gabriel Rodrigues
        </h1>
        <span class="text-lg tracking-widest bg-linear-to-r from-primary via-[#feb47b] to-[#ffcc00] bg-clip-text text-transparent">
            Engenharia e Ciência de Dados
        </span>
    </div>

    <p class="text-text-secondary text-lg leading-relaxed max-w-xl">
        Dados, análise e muita curiosidade
    </p>

    <article class="flex gap-6 items-center justify-center">
        @for (item of socialLinks; track item.icon) {
            <a [href]="item.url" target="_blank" class="social-link">
                <mat-icon [svgIcon]="item.icon" class="social-icon duration-300"></mat-icon>
            </a>
        }
    </article>

    <div class="flex gap-4 items-center">
        <a href="assets/cv/cv.pdf" target="_blank" rel="noopener" class="home-btn flex items-center justify-center text-text-secondary gap-2 border border-dark-gray rounded-lg py-2 px-5 duration-300">
            <span>Download CV</span>
            <mat-icon>download</mat-icon>
        </a>
        <a routerLink="/projetos" class="home-btn flex items-center justify-center text-text-secondary gap-2 border border-dark-gray rounded-lg py-2 px-5 duration-300">
            <span>Ver projetos</span>
            <mat-icon>arrow_forward</mat-icon>
        </a>
    </div>
</section>
